name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: go_be_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d go_be_template"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/go_be_template?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify generated code
        run: |
          go tool sqlc generate
          go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          git diff --exit-code internal/store/db internal/transport/openapi || \
            (echo "generated code out of date — run 'make generate'" && exit 1)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9.0

      - name: govulncheck
        run: go tool govulncheck ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: |
          go build -o /dev/null ./cmd/api
          go build -o /dev/null ./cmd/migrate
